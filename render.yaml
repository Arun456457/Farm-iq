services:
  - type: web
    name: farmiq
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://farmiq-z14k.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: farmiq-db
          property: connectionString

databases:
  - name: farmiq-db
    plan: free
    region: oregon
    databaseName: farmiq
    user: farmiq_user


