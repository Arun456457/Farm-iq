<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FarmiQ" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>FarmiQ — Smart Agriculture & Mandi Marketplace</title>
    <meta name="description" content="Direct agricultural marketplace connecting farmers and customers with live fluctuating mandi rates, real-time sync, dynamic pricing, storage booking, live tracking, and Gemini AI assistant." />
    <meta property="og:title" content="FarmiQ — Smart Agriculture & Mandi Marketplace" />
    <meta property="og:description" content="Direct agricultural marketplace connecting farmers and customers with live fluctuating mandi rates, real-time sync, dynamic pricing, storage booking, live tracking, and Gemini AI assistant." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      // 1. Service Worker Registration with auto-update
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.warn('PWA ServiceWorker registration note:', err);
          });
        });
      }

      // 2. Pre-React Chunk & Script Error Auto-Recovery
      // If a deployed bundle hash changed or network dropped, auto-heal cleanly
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message.toLowerCase() : '';
        var target = e.target;
        var isScriptTag = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
        if (isScriptTag || msg.includes('loading chunk') || msg.includes('dynamically imported module') || msg.includes('failed to fetch')) {
          var reloadKey = 'farmiq_auto_heal_reload';
          var lastReload = parseInt(sessionStorage.getItem(reloadKey) || '0', 10);
          var now = Date.now();
          if (now - lastReload > 12000) {
            sessionStorage.setItem(reloadKey, String(now));
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister();
                }
                window.location.reload();
              }).catch(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, true);
    </script>

    <style>
      /* Zero-delay instant splash loader styles */
      body {
        margin: 0;
        padding: 0;
        background-color: #032b1f;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #farmiq-splash {
        min-height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #064e3b 0%, #032b1f 65%, #021a13 100%);
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      .farmiq-splash-icon {
        width: 84px;
        height: 84px;
        border-radius: 24px;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3);
        margin-bottom: 22px;
        animation: farmiqPulse 2s ease-in-out infinite;
      }
      @keyframes farmiqPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.35); }
        50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(16, 185, 129, 0.65); }
      }
      .farmiq-splash-title {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0 0 6px 0;
        background: linear-gradient(135deg, #ffffff 0%, #a7f3d0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .farmiq-splash-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.3);
        color: #34d399;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        padding: 4px 12px;
        border-radius: 9999px;
        margin-bottom: 12px;
      }
      .farmiq-splash-subtitle {
        color: #94a3b8;
        font-size: 14px;
        max-width: 320px;
        line-height: 1.5;
        margin: 0 0 28px 0;
      }
      .farmiq-loader-bar {
        width: 180px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 16px;
      }
      .farmiq-loader-progress {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #10b981, #34d399);
        border-radius: 9999px;
        animation: farmiqSlide 1.5s ease-in-out infinite;
      }
      @keyframes farmiqSlide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      .farmiq-status-text {
        font-size: 13px;
        color: #6ee7b7;
        font-weight: 500;
        min-height: 20px;
        transition: opacity 0.3s ease;
      }
      .farmiq-reload-btn {
        display: none;
        margin-top: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #e2e8f0;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .farmiq-reload-btn:hover {
        background: rgba(255, 255, 255, 0.16);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant Splash Screen: Disappears automatically when React mounts -->
      <div id="farmiq-splash">
        <div class="farmiq-splash-icon">
          <!-- Agricultural leaf sprout icon -->
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>
        <div class="farmiq-splash-badge">
          <span style="display:inline-block; width:6px; height:6px; background:#10b981; border-radius:50%;"></span>
          Direct Farm Network
        </div>
        <h1 class="farmiq-splash-title">FarmiQ</h1>
        <p class="farmiq-splash-subtitle">Smart Agriculture & Mandi Marketplace</p>
        
        <div class="farmiq-loader-bar">
          <div class="farmiq-loader-progress"></div>
        </div>

        <div id="farmiq-status" class="farmiq-status-text">Starting FarmiQ...</div>

        <button id="farmiq-retry-btn" class="farmiq-reload-btn" onclick="window.location.reload(true)">
          Taking longer than usual? Click to reload
        </button>
      </div>

      <script>
        // Progressive status updater to guide the user during Render cold start or network delay
        (function() {
          var statusEl = document.getElementById('farmiq-status');
          var retryBtn = document.getElementById('farmiq-retry-btn');
          if (!statusEl) return;
          
          setTimeout(function() {
            if (statusEl) statusEl.textContent = 'Connecting to secure agricultural database...';
          }, 3500);

          setTimeout(function() {
            if (statusEl) statusEl.textContent = 'Waking up cloud server (Render cold start)... Please hold on.';
            if (retryBtn) retryBtn.style.display = 'inline-block';
          }, 8000);

          setTimeout(function() {
            if (statusEl) statusEl.textContent = 'Almost ready! Finishing platform synchronization...';
          }, 20000);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
